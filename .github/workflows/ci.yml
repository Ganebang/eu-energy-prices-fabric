name: ci

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/ci.yml"]

jobs:
  energy-toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest -q

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: energy_toolkit-wheel
          path: dist/*.whl
