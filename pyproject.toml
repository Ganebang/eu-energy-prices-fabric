[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy_toolkit"
version = "1.0.1"
description = "Shared helpers for the EU-Energy-Prices Fabric project: API clients, date windows, Delta helpers."
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
spark = ["pyspark>=3.5", "delta-spark>=3.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # API arrays are zipped leniently on purpose
